name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend-Tests (SQLite)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CACHE_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Run Pytest Suite
        run: |
          MEDIA_ROOT="$RUNNER_TEMP/antidote-media" pytest

  postgres:
    name: Backend-Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: antidote
          POSTGRES_USER: antidote
          POSTGRES_PASSWORD: antidote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antidote -d antidote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://antidote:antidote@127.0.0.1:5432/antidote

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python Dependencies
        run: python -m pip install -r requirements.txt pytest pytest-django
      - name: Check Migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Pytest Suite
        run: MEDIA_ROOT="$RUNNER_TEMP/antidote-media" pytest

  build:
    name: Frontend-Build und Browser-Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Backend Dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and Test in Chromium
        run: |
          npm run test:browser
